# dsh-settings-order bundle patch: mount the Settings-navigation ordering
# plugin.
#
# `name` is the package name, resolved through the profile's node_modules.
# The host half exports a volatile Config field for DSH's schema-derived
# settings forms; the client half loads immediately (platform: web), reads the
# `settings-order` entry through the settings scope, and reorders the Settings
# dialog's navigation rows — falling back to browser-local storage where the
# transport cannot carry the preference.
- insert:
    - id: settings-order
      name: dsh-settings-order
